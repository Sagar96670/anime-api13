name: Sync DesiDubAnime Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desidubanime-sync.yml"
      - "desidubanime-sync.js"
      - "sync-anime.js"
      - "fast-sync.js"
      - "database.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: desidubanime-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync catalog from DesiDubAnime
        run: npm run sync

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- anime-db.json; then
            echo "Catalog is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime-db.json
          git commit -m "Update DesiDubAnime catalog"
          git push origin HEAD:main
