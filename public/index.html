<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #ffffff;
    }

    header {
      padding: 20px;
      background: #171a23;
      border-bottom: 1px solid #292d38;
    }

    .container {
      width: min(1200px, 94%);
      margin: auto;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitle {
      color: #9da3b4;
      margin-top: 6px;
      font-size: 14px;
    }

    main {
      padding: 30px 0;
    }

    #status {
      color: #9da3b4;
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 20px;
      background: #171a23;
      color: #ffffff;
      border: 1px solid #292d38;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .search-box:focus {
      border-color: #4b5265;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: #171a23;
      border: 1px solid #292d38;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .anime-card:hover {
      transform: translateY(-4px);
    }

    .anime-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .anime-title {
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
    }

    .empty {
      color: #9da3b4;
      padding: 30px 0;
    }

</style>
</head>

<body>

  <header>
    <div class="container">
      <div class="logo">Anime API</div>
      <div class="subtitle">Anime & Movies collection</div>
    </div>
  </header>

  <main class="container">
    <div id="status">Loading...</div>
    <input
      id="searchBox"
      class="search-box"
      type="search"
      placeholder="🔎 Search anime or movie..."
      autocomplete="off"
    >

<div id="animeGrid" class="anime-grid"></div>
  </main>

  <script>
    let allContent = [];

    function renderContent(list) {
      const grid = document.getElementById("animeGrid");
      const status = document.getElementById("status");

      status.textContent = `${list.length} items found`;

      if (!list.length) {
        grid.innerHTML = '<div class="empty">No results found.</div>';
        return;
      }

      grid.innerHTML = list.map(item => {
        const isMovie = item.content_type === "movie";

        const url = isMovie
          ? `/movie.html?id=${encodeURIComponent(item.id)}`
          : `/anime.html?id=${encodeURIComponent(item.id)}`;

        return `
          <div
            class="anime-card"
            onclick="window.location.href='${url}'"
          >
            <img
              src="${item.poster || ""}"
              alt="${escapeHtml(item.title)}"
              loading="lazy"
            >

            <div class="anime-title">
              ${escapeHtml(item.title)}
            </div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadContent() {
      const status = document.getElementById("status");

      try {
        const response = await fetch("/api/catalog");
        const result = await response.json();

        if (!result.status) {
          throw new Error("Catalog API request failed");
        }

        allContent = result.data || [];

        renderContent(allContent);
      } catch (error) {
        console.error(error);
        status.textContent = "Failed to load catalog.";
      }
    }

    document.getElementById("searchBox").addEventListener("input", function() {
      const query = this.value.trim().toLowerCase();

      const filtered = allContent.filter(item => {
        const searchableText = [
          item.title,
          item.id,
          item.source_url
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return searchableText.includes(query);
      });

      renderContent(filtered);
    });

    loadContent();
  </script>

</body>
</html>
